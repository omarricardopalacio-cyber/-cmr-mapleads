[build]
  # Copiar crons (engine-dispatch / daily-cleanup) al dir de functions de Nitro;
  # sin esto Netlify no publica los scheduled jobs y fallan IA diferida, flujos y masivos.
  command = "npm run build && mkdir -p .netlify/functions-internal && cp -f netlify/functions/*.mjs .netlify/functions-internal/"
  publish = "dist"
  functions = ".netlify/functions-internal"

[functions]
  node_bundler = "esbuild"

[functions."daily-cleanup"]
  schedule = "0 6 * * *"

# Flujos / waits / broadcasts / mensajes programados — cada minuto (UTC)
[functions."engine-dispatch"]
  schedule = "* * * * *"

[[headers]]
  for = "/store-sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/store-pwa-icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "image/svg+xml"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

